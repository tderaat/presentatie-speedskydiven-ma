<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups luchtstroming</title>
<style>
  body { margin: 0; padding: 24px 16px 60px; background: #1b2a41; color: #fff; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
  h1 { text-align: center; font-weight: normal; opacity: .8; font-size: 20px; }
  .option { width: min(900px, 100%); margin: 0 auto 40px; }
  .option h3 { margin: 0 0 4px; font-size: 22px; color: #ffd23f; }
  .option p { margin: 0 0 10px; opacity: .8; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cell { border-radius: 14px; background: linear-gradient(180deg, #0b3d91 0%, #4fb3ff 100%); text-align: center; padding: 10px 0 18px; }
  .cell svg { width: 100%; height: 300px; display: block; }
  .cell .title { font-size: 34px; font-weight: bold; text-shadow: 0 3px 0 rgba(0,0,0,.2); margin-top: -10px; }
  .cell small { opacity: .7; }

  /* A: stroomlijnen die om het lichaam heen buigen */
  .flow { animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -48; } }

  /* B en D: strepen die omhoog wegschieten */
  .streak { animation: streak 1s linear infinite; }
  @keyframes streak {
    0% { transform: translateY(40px); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-70px); opacity: 0; }
  }

  /* C: kringeltjes in het zog */
  .swirl { animation: swirl 2.4s ease-out infinite; }
  @keyframes swirl {
    0% { transform: translateY(20px); opacity: 0; }
    25% { opacity: .85; }
    100% { transform: translateY(-70px); opacity: 0; }
  }

  /* D: boeggolf die zacht pulseert */
  .bow { animation: bow 1.2s ease-in-out infinite; }
  @keyframes bow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

  /* Huidige situatie: rechte strepen */
  .current::before { content: ''; }
</style>
</head>
<body>

<h1>Luchtstroming rond het poppetje op het beginscherm: links de huidige gele figuur, rechts het speed poppetje</h1>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="diver-shape" transform="rotate(180 15 40)"
      d="M15 0C17 0 19 2 19 5C19 8 17 10 16 12C18 12 21 14 22 18C23 22 22 26 20 30C19 33 18 36 18 40C18 44 19 48 20 52C21 56 22 60 21 64C20 68 18 72 17 74C16 76 15 78 15 80C15 78 14 76 13 74C12 72 10 68 9 64C8 60 9 56 10 52C11 48 12 44 12 40C12 36 11 33 10 30C8 26 7 22 8 18C9 14 12 12 14 12C13 10 11 8 11 5C11 2 13 0 15 0Z"/>
    <symbol id="flyer-head" viewBox="0 0 60 140">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34,62 Q36.5,35.5 37,11" stroke="#d6a21c" stroke-width="8"/>
        <path d="M30,104 Q37.5,90 43,76" stroke="#d6a21c" stroke-width="5.5"/>
        <path d="M29,109 Q25,86 31,62" stroke="#ffd23f" stroke-width="15"/>
        <rect x="34" y="69" width="11" height="33" rx="4" fill="#b07f00"/>
        <circle cx="28" cy="125" r="9" fill="#ffd23f"/>
        <path d="M33,104 Q42.5,90.5 50,75" stroke="#ffd23f" stroke-width="6"/>
        <path d="M30,62 Q30.5,36 29,10" stroke="#ffd23f" stroke-width="9"/>
      </g>
    </symbol>
    <linearGradient id="wake" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div id="options"></div>

<script>
  // Twee figuren, allebei met het hoofd onderaan. hw = halve breedte van het lichaam, top = voeten, head = onderkant hoofd.
  var FIGURES = [
    { name: 'Huidige gele figuur', svg: '<g transform="translate(100 134) scale(1.6) translate(-15 -40)"><use href="#diver-shape" fill="#ffd23f"/></g>', hw: 15, top: 70, head: 198 },
    { name: 'Speed poppetje', svg: '<use href="#flyer-head" x="71" y="62" width="58" height="135"/>', hw: 22, top: 72, head: 194 }
  ];

  function line(d, w, op, cls, style) {
    return '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="' + w + '" stroke-linecap="round" opacity="' + op + '"' +
      (cls ? ' class="' + cls + '"' : '') + (style ? ' style="' + style + '"' : '') + '/>';
  }

  var STYLES = [
    {
      title: 'Nu: vier rechte strepen',
      desc: 'Ter vergelijking: de huidige versie, rechte strepen boven het poppetje.',
      draw: function (f) {
        return [-18, -6, 6, 18].map(function (x, i) {
          return line('M' + (100 + x) + ' ' + (f.top - 60 + (i % 2) * 8) + ' V' + (f.top - 6), 3, .55);
        }).join('');
      }
    },
    {
      title: 'A: stroomlijnen om het lichaam',
      desc: 'Lijnen komen van onder, buigen om het hoofd heen, lopen langs het lichaam en sluiten boven weer. Ze stromen zacht omhoog.',
      draw: function (f) {
        var out = '';
        [[8, 2.6, .85], [22, 2.2, .6], [38, 1.8, .4]].forEach(function (o, k) {
          [-1, 1].forEach(function (s) {
            var d = f.hw + o[0], x0 = 100 + s * (4 + o[0] * .3), xs = 100 + s * d, xe = 100 + s * (f.hw * .4 + o[0] * .7);
            var p = 'M' + x0 + ' 300 C' + x0 + ' ' + (f.head + 30) + ' ' + xs + ' ' + (f.head + 15) + ' ' + xs + ' ' + (f.head - 20) +
                    ' L' + xs + ' ' + (f.top + 20) + ' C' + xs + ' ' + (f.top - 15) + ' ' + xe + ' ' + (f.top - 30) + ' ' + xe + ' -10';
            out += line(p, o[1], o[2], 'flow', 'stroke-dasharray:18 30;animation-delay:-' + (k * .37 + (s > 0 ? .2 : 0)) + 's');
          });
        });
        return out;
      }
    },
    {
      title: 'B: snelheidsstrepen die wegschieten',
      desc: 'Losse strepen van verschillende lengte schieten langs en boven het poppetje omhoog, zoals bij een stripfiguur die heel hard gaat.',
      draw: function (f) {
        var xs = [-1.9, -1.35, -.8, -.3, .3, .8, 1.35, 1.9], out = '';
        xs.forEach(function (m, i) {
          var x = 100 + m * f.hw * 1.6, len = 30 + (i * 37) % 45, y = f.top - 20 + (i * 53) % 90;
          out += '<g class="streak" style="animation-delay:-' + ((i * .29) % 1).toFixed(2) + 's;animation-duration:' + (.8 + (i % 3) * .2) + 's">' +
                 line('M' + x + ' ' + y + ' v' + (-len), i % 2 ? 2 : 3, i % 2 ? .5 : .8) + '</g>';
        });
        return out;
      }
    },
    {
      title: 'C: zog met kringeltjes',
      desc: 'Een zachte witte sliert achter (boven) het poppetje, met kleine luchtkringeltjes die loslaten en wegdrijven. Rustig en sierlijk.',
      draw: function (f) {
        var w = f.hw * 1.2, out = '<path d="M' + (100 - w) + ' ' + (f.top + 30) + ' Q' + (100 - w * 1.6) + ' ' + (f.top - 40) + ' 100 -10 Q' + (100 + w * 1.6) + ' ' + (f.top - 40) + ' ' + (100 + w) + ' ' + (f.top + 30) + ' Z" fill="url(#wake)"/>';
        // Kringeltje: een spiraal die naar binnen draait. Links en rechts om en om, gespiegeld.
        [[-1, 0], [1, .8], [-1, 1.6], [1, 2.0]].forEach(function (s, i) {
          var cx = 100 + s[0] * (f.hw + 8), cy = f.top + 20 - (i % 2) * 14, k = s[0];
          var d = 'M' + (cx - 9 * k) + ' ' + (cy + 4) + ' Q' + (cx - 9 * k) + ' ' + (cy - 8) + ' ' + cx + ' ' + (cy - 8) +
                  ' Q' + (cx + 8 * k) + ' ' + (cy - 8) + ' ' + (cx + 8 * k) + ' ' + cy +
                  ' Q' + (cx + 8 * k) + ' ' + (cy + 6) + ' ' + (cx + 2 * k) + ' ' + (cy + 6) +
                  ' Q' + (cx - 3 * k) + ' ' + (cy + 6) + ' ' + (cx - 3 * k) + ' ' + (cy + 1);
          out += '<g class="swirl" style="animation-delay:-' + s[1] + 's">' +
                 '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>';
        });
        out += line('M' + (100 - f.hw - 14) + ' ' + (f.head - 10) + ' Q' + (100 - f.hw - 18) + ' ' + ((f.head + f.top) / 2) + ' ' + (100 - f.hw - 6) + ' ' + (f.top - 10), 2, .45);
        out += line('M' + (100 + f.hw + 14) + ' ' + (f.head - 10) + ' Q' + (100 + f.hw + 18) + ' ' + ((f.head + f.top) / 2) + ' ' + (100 + f.hw + 6) + ' ' + (f.top - 10), 2, .45);
        return out;
      }
    },
    {
      title: 'D: boeggolf onder het hoofd',
      desc: 'Bogen onder het hoofd, zoals de golf voor de neus van een boot of straaljager, plus strepen die achter het poppetje wegschieten.',
      draw: function (f) {
        var out = '';
        [0, 1, 2].forEach(function (k) {
          var gap = 6 + k * 12, spread = f.hw + 12 + k * 14, y = f.head + gap;
          out += '<path class="bow" style="animation-delay:-' + (k * .3) + 's" d="M' + (100 - spread) + ' ' + (y - 60 - k * 10) + ' Q' + (100 - spread * .45) + ' ' + (y + 6) + ' 100 ' + y + ' Q' + (100 + spread * .45) + ' ' + (y + 6) + ' ' + (100 + spread) + ' ' + (y - 60 - k * 10) + '" fill="none" stroke="#fff" stroke-width="' + (2.6 - k * .5) + '" stroke-linecap="round"/>';
        });
        [-.9, -.3, .3, .9].forEach(function (m, i) {
          out += '<g class="streak" style="animation-delay:-' + (i * .25) + 's">' + line('M' + (100 + m * f.hw) + ' ' + (f.top - 8) + ' v-38', 2.5, .7) + '</g>';
        });
        return out;
      }
    }
  ];

  var html = '';
  STYLES.forEach(function (s) {
    html += '<div class="option"><h3>' + s.title + '</h3><p>' + s.desc + '</p><div class="pair">';
    FIGURES.forEach(function (f) {
      html += '<div class="cell"><svg viewBox="0 -10 200 300">' + s.draw(f) + f.svg + '</svg>' +
              '<div class="title">Speed skydiven</div><small>' + f.name + '</small></div>';
    });
    html += '</div></div>';
  });
  document.getElementById('options').innerHTML = html;
</script>
</body>
</html>
