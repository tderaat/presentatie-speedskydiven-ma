<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups landen</title>
<style>
  body { margin: 0; padding: 24px 16px 60px; background: #1b2a41; color: #fff; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
  h1 { text-align: center; font-weight: normal; opacity: .8; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: min(1100px, 100%); margin: 0 auto; }
  .option h3 { margin: 0 0 4px; font-size: 20px; color: #ffd23f; }
  .option p { margin: 0 0 10px; opacity: .8; min-height: 3.6em; }
  .frame { border-radius: 14px; padding: 16px; background: linear-gradient(180deg, #0b3d91 0%, #4fb3ff 100%); }
  .frame svg { width: 100%; display: block; }
  svg text { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; fill: #fff; }
</style>
</head>
<body>

<h1>Stap 4 "Landen": kies een poppetje (geel, zelfde stijl als in stap 2 en 3)</h1>
<div class="grid" id="options"></div>

<script>
  var MAIN = '#ffd23f', SHADE = '#d6a21c', RIG = '#b07f00', CANOPY = '#5be37d', CELLS = '#2f8f4e';

  // Vloeiende lijn door drie punten: de bocht gaat precies door het middelste gewricht.
  function curve(p) {
    if (p.length === 2) return 'M' + p[0] + ' L' + p[1];
    var cx = 2 * p[1][0] - (p[0][0] + p[2][0]) / 2, cy = 2 * p[1][1] - (p[0][1] + p[2][1]) / 2;
    return 'M' + p[0] + ' Q' + cx + ',' + cy + ' ' + p[2];
  }
  function mirror(pts) { return pts.map(function (p) { return [-p[0], p[1]]; }); }

  // Een figuur is een lijst onderdelen in tekenvolgorde, met het hoofd rond (0,0).
  function draw(parts) {
    return parts.map(function (p) {
      if (p.head) return '<circle cx="' + p.head[0] + '" cy="' + p.head[1] + '" r="6" fill="' + MAIN + '"/>';
      if (p.rig) return '<rect x="' + p.rig[0] + '" y="' + p.rig[1] + '" width="' + p.rig[2] + '" height="' + p.rig[3] + '" rx="2.5" fill="' + RIG + '"/>';
      return '<path d="' + curve(p.pts) + '" fill="none" stroke="' + (p.shade ? SHADE : MAIN) + '" stroke-width="' + p.w + '" stroke-linecap="round" stroke-linejoin="round"/>';
    }).join('');
  }

  // Zittend in het tuig, van opzij, kijkt naar rechts. Handen omhoog aan de stuurlijnen.
  var SEATED = { hands: [[1, -9], [4, -9]], parts: [
    { pts: [[-1,9],[3,1],[1,-9]], w: 3, shade: 1 },
    { pts: [[-3,24],[9,27],[10,39]], w: 5, shade: 1 },
    { rig: [-10, 7, 6, 15] },
    { pts: [[0,7],[-1,16],[-3,24]], w: 10 },
    { head: [0, 0] },
    { pts: [[1,9],[6,1],[4,-9]], w: 3.4 },
    { pts: [[-2,24],[12,26],[14,38]], w: 5.5 }
  ]};
  // Hangend onder de parachute, van voren. Beide handen omhoog aan de stuurlijnen.
  var HANGING = { hands: [[-8, -10], [8, -10]], parts: [
    { rig: [-8, 7, 16, 15] },
    { pts: [[0,7],[0,15],[0,24]], w: 11 },
    { head: [0, 0] },
    { pts: [[-4,9],[-10,2],[-8,-10]], w: 3.4 }, { pts: mirror([[-4,9],[-10,2],[-8,-10]]), w: 3.4 },
    { pts: [[-3,23],[-4,34],[-4,45]], w: 5 }, { pts: mirror([[-3,23],[-4,34],[-4,45]]), w: 5 }
  ]};
  // Geland, van voren, armen omhoog. Voeten op y = 48.
  var CHEER = { feet: 48, parts: [
    { rig: [-8, 7, 16, 15] },
    { pts: [[0,7],[0,15],[0,24]], w: 11 },
    { head: [0, 0] },
    { pts: [[-4,9],[-11,1],[-13,-9]], w: 3.4 }, { pts: mirror([[-4,9],[-11,1],[-13,-9]]), w: 3.4 },
    { pts: [[-3,23],[-4,35],[-5,46]], w: 5 }, { pts: mirror([[-3,23],[-4,35],[-5,46]]), w: 5 }
  ]};
  // Uitlopen na de landing, van opzij, naar rechts. Voeten op y = 46.
  var RUNNING = { feet: 46, parts: [
    { pts: [[1,10],[-6,17],[-11,13]], w: 3, shade: 1 },
    { pts: [[-1,23],[-7,32],[-13,39]], w: 5, shade: 1 },
    { rig: [-9, 8, 6, 14] },
    { pts: [[3,7],[1,15],[-1,23]], w: 10 },
    { head: [3, 0] },
    { pts: [[2,10],[9,16],[14,12]], w: 3.4 },
    { pts: [[-1,23],[8,31],[10,44]], w: 5.5 }
  ]};
  // Staand naast de neergelegde parachute, van opzij, een hand omhoog (zwaaien). Voeten op y = 48.
  var WAVE = { feet: 48, parts: [
    { pts: [[-1,10],[-5,18],[-6,26]], w: 3, shade: 1 },
    { pts: [[-1,23],[-2,35],[-3,46]], w: 5, shade: 1 },
    { rig: [-9, 8, 6, 14] },
    { pts: [[1,7],[0,15],[0,23]], w: 10 },
    { head: [1, 0] },
    { pts: [[2,10],[9,4],[11,-7]], w: 3.4 },
    { pts: [[1,23],[3,35],[4,46]], w: 5.5 }
  ]};

  // Open parachute (70 breed) met een figuur eronder; de lijnen lopen naar de handen.
  function canopy(fig, s) {
    var hx = 35, hy = 58, out = '<path d="M5 20 Q35 2 65 20 L62 28 Q35 13 8 28 Z" fill="' + CANOPY + '"/>' +
      '<path d="M20 12 L19 23 M35 9 V18 M50 12 L51 23" stroke="' + CELLS + '" stroke-width="1.5"/>';
    var hands = fig.hands.map(function (h) { return [hx + h[0] * s, hy + h[1] * s]; });
    var left = hands[0], right = hands[hands.length - 1];
    out += '<path d="M8 28 L' + left + ' M20 21 L' + left + ' M50 21 L' + right + ' M62 28 L' + right + '" stroke="#fff" stroke-width=".9" opacity=".8"/>';
    out += '<g transform="translate(' + hx + ' ' + hy + ') scale(' + s + ')">' + draw(fig.parts) + '</g>';
    return out;
  }
  function onGround(fig, x, groundY, s) {
    return '<g transform="translate(' + x + ' ' + (groundY - fig.feet * s) + ') scale(' + s + ')">' + draw(fig.parts) + '</g>';
  }

  var PILE = '<path d="M-26 0 Q-30 -10 -18 -12 Q-10 -18 0 -11 Q10 -15 14 -6 Q20 -4 18 0 Z" fill="' + CANOPY + '"/>' +
             '<path d="M-18 -6 Q-8 -10 2 -5 M-4 -3 Q6 -7 12 -2" stroke="' + CELLS + '" stroke-width="1.4" fill="none"/>';

  // Scène zoals paneel 4 in de presentatie: 220 breed, grond op 230.
  function scene(top, bottom, path) {
    return '<svg viewBox="0 0 220 380">' +
      '<rect width="220" height="380" rx="22" fill="#fff" opacity=".14"/>' +
      '<rect x="0" y="230" width="220" height="20" fill="#2f8f4e"/>' + top +
      '<path d="' + path + '" fill="none" stroke="#5be37d" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round"/>' + bottom +
      '<circle cx="34" cy="294" r="18" fill="#fff"/><text x="34" y="295" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-size="20" style="fill:#0b3d91">4</text>' +
      '<text x="62" y="301" font-size="21" font-weight="bold">Landen</text>' +
      '<text x="20" y="340" font-size="16" opacity=".85">parachute open</text>' +
      '<text x="20" y="362" font-size="16" opacity=".85">ongeveer 5 min.</text></svg>';
  }

  var OPTIONS = [
    { title: 'A: zittend in het tuig, juichend geland', desc: 'Onder de parachute zit het poppetje (van opzij) met de handen aan de stuurlijnen. Beneden staat het met de armen omhoog.',
      svg: scene('<g transform="translate(14 10) scale(1.3)">' + canopy(SEATED, 1) + '</g>', onGround(CHEER, 168, 230, 1.05), 'M80 128 C 100 170, 140 172, 160 178') },
    { title: 'B: hangend van voren, juichend geland', desc: 'Onder de parachute hangt het poppetje recht van voren, beide armen omhoog aan de stuurlijnen. Beneden juicht het.',
      svg: scene('<g transform="translate(14 6) scale(1.3)">' + canopy(HANGING, .95) + '</g>', onGround(CHEER, 168, 230, 1.05), 'M76 140 C 100 175, 140 172, 160 178') },
    { title: 'C: zittend, uitlopen bij de landing', desc: 'Onder de parachute zit het poppetje van opzij. Bij de landing rent het een paar stappen uit, de parachute zakt achter hem neer.',
      svg: scene('<g transform="translate(14 10) scale(1.3)">' + canopy(SEATED, 1) + '</g>',
                 '<g transform="translate(150 230)">' + PILE + '</g>' + onGround(RUNNING, 180, 230, 1.05), 'M80 128 C 100 170, 130 175, 150 205') },
    { title: 'D: zittend, zwaaiend naast de parachute', desc: 'Onder de parachute zit het poppetje van opzij. Beneden staat het naast de neergelegde parachute en zwaait.',
      svg: scene('<g transform="translate(14 10) scale(1.3)">' + canopy(SEATED, 1) + '</g>',
                 '<g transform="translate(150 230)">' + PILE + '</g>' + onGround(WAVE, 182, 230, 1.05), 'M80 128 C 100 170, 140 172, 165 178') }
  ];

  document.getElementById('options').innerHTML = OPTIONS.map(function (o) {
    return '<div class="option"><h3>' + o.title + '</h3><p>' + o.desc + '</p><div class="frame">' + o.svg + '</div></div>';
  }).join('');
</script>
</body>
</html>
